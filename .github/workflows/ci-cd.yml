name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Vet & build backend
        working-directory: server
        run: |
          go vet ./...
          go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run build

  deploy:
    needs: build-test          # only runs if the build passed
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m   # builds are slow on t3.micro — default 30s WILL time out
          script: |
            cd ~/realtime-task-app
            git pull origin main
            docker compose up -d --build
            docker image prune -f
            sleep 10
            curl -f -k https://localhost > /dev/null && echo "✅ Site is up"