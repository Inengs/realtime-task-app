# LOCAL development. Loaded automatically by `docker compose up`.
# Everything is bound to 127.0.0.1 so nothing is reachable from your network.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mailpit:
        condition: service_started

  web:
    ports:
      - "127.0.0.1:3000:80"

  # Catches every outgoing email. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
