# Base services, shared by every environment.
# No ports are published here: each environment decides what to expose.
#   local : docker-compose.override.yml   (loaded automatically by `docker compose up`)
#   prod  : docker-compose.prod.yml       (adds Caddy; see .env.prod.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  api:
    build: ./server
    environment:
      DB_HOST: db # service name, not localhost
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      APP_ENV: ${APP_ENV:?set APP_ENV}
      GIN_MODE: ${GIN_MODE:-release}
      PORT: 8080
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:?set EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:?set EMAIL_SMTP_PORT}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        # Baked into the JS bundle at build time, so each environment needs its own build.
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL:?set VITE_WS_URL}
    depends_on:
      - api

volumes:
  pgdata:
