services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskapp
    ports:
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  api:
    build: ./server
    environment:
      DB_HOST: db          # service name, not localhost — that's the container networking gotcha
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: taskapp
      DB_SSLMODE: disable
      SESSION_SECRET: dev-secret
      FRONTEND_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      APP_ENV: development
      PORT: 8080
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy   # app crashes if DB isn't ready yet

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: https://taskflow-api.inengiyeemmanuel.site
        VITE_WS_URL: wss://taskflow-api.inengiyeemmanuel.site
    ports:
      - "3000:80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config: